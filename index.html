<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小游戏合集</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#10101a;color:#fff;padding:24px 16px 40px}
h1{font-size:22px;margin:4px 0 4px}p.sub{color:#9a9ab0;margin:0 0 20px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:720px;margin:0 auto}
.card{display:block;background:#1c1c2e;border:1px solid #2c2c44;border-radius:16px;padding:18px 14px;text-decoration:none;color:#fff}
.card b{display:block;font-size:17px;margin-bottom:6px}.card span{font-size:13px;color:#9a9ab0;line-height:1.5}
.card:active{background:#262640}
</style>
</head>
<body>
<div style="max-width:720px;margin:0 auto"><h1>🎮 小游戏合集</h1>
<p class="sub">点开即玩，进度保存在本机浏览器里</p></div>
<div class="grid">
  <a class="card" href="./snake-clash/">
    <b>蛇蛇竞技场</b>
    <span>4 蛇同场竞技，吃豆变长，活到最后</span>
  </a>
  <a class="card" href="./suika/">
    <b>合成大西瓜</b>
    <span>水果合成，两个西瓜相碰 +1000 分</span>
  </a>
  <a class="card" href="./relax/">
    <b>Relax · 40 个减压小游戏</b>
    <span>捏泡泡纸、切肥皂、动感沙……10 款可玩</span>
  </a>
  <a class="card" href="./tidy-up/">
    <b>收纳达人</b>
    <span>把东西放回原位，限时评星</span>
  </a>
  <a class="card" href="./magic-sort/">
    <b>魔法分类</b>
    <span>点瓶倒色，把同色液体收到一起</span>
  </a>
  <a class="card" href="./meowdoku/">
    <b>猫咪数独</b>
    <span>标准 9×9 数独，三档难度</span>
  </a>
  <a class="card" href="./rotate-rings/">
    <b>旋转圆环</b>
    <span>转一格，让每条辐条同色</span>
  </a>
  <a class="card" href="./block-blast/">
    <b>积木爆破</b>
    <span>把积木拖到棋盘上，填满整行整列消除</span>
  </a>
  <a class="card" href="./avatar-world/">
    <b>Avatar World 捏脸换装馆</b>
    <span>捏脸换装，保存形象，导出 PNG 分享</span>
  </a>
</div>
</body>
</html>
